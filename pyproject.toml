[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damaged-qr-recovery"
version = "0.2.0"
description = "Evidence-first Agent Skill and Python primitives for damaged QR recovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abolfazl Shahi"}]
dependencies = []

[project.optional-dependencies]
image = ["opencv-python>=4.8", "qrcode>=7.4"]
dev = ["pytest>=8", "pytest-cov>=5"]
all = ["opencv-python>=4.8", "qrcode>=7.4", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
qr-recovery = "damaged_qr_recovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
